<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ee91b8;--deep:#c95f91;--soft:#ffe8f1;--pale:#fff7fa;--line:#f7c7da;--ink:#9f5276}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 75%,#fff 0 3px,transparent 4px),linear-gradient(135deg,#ffeaf2,#fbd3e4 55%,#fff0f6);font-family:Quicksand,system-ui,sans-serif;color:var(--ink)}
.wrap{width:min(100%,370px);position:relative}
.sparkle{position:absolute;color:#fff;font-size:25px;text-shadow:0 2px 8px #e69abb;animation:float 3s ease-in-out infinite;pointer-events:none}
.s1{top:12px;left:-17px}.s2{right:-13px;top:100px;animation-delay:1s}.s3{bottom:28px;left:-15px;animation-delay:1.7s}
@keyframes float{50%{transform:translateY(-8px) rotate(12deg)}}
.calculator{background:#fffafd;border:2px solid #fff;outline:1px solid var(--line);border-radius:30px;padding:23px;box-shadow:0 20px 50px #c86e9630,inset 0 0 0 5px #fff5f9}
.top{display:flex;justify-content:space-between;align-items:center;margin:1px 2px 18px;min-height:112px;padding-right:105px;position:relative}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--deep)}.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:1.4px;color:#d99ab6;margin-top:3px}.heart{font-size:24px;color:#ed9cbd}.nekopara{display:block;position:absolute;right:-12px;top:-19px;width:132px;height:148px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 5px #d98eae55);pointer-events:none;z-index:2}
.screen{min-height:112px;border:1.5px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#fff0f6,#fff8fb);padding:16px 18px;margin-bottom:17px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;box-shadow:inset 0 3px 9px #e9a9c31c;overflow:hidden}.expression{width:100%;min-height:20px;text-align:right;color:#d69ab4;font-size:13px;overflow:hidden;white-space:nowrap}.result{width:100%;text-align:right;font-size:clamp(28px,8vw,38px);font-weight:800;color:#b95783;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;min-height:61px;border-radius:18px;background:#ffedf4;color:#b85f88;font:700 19px Quicksand,sans-serif;cursor:pointer;box-shadow:0 4px 0 #f5d2e0;transition:transform .12s,background .15s,box-shadow .12s;user-select:none}button:hover{background:#ffe1ed;transform:translateY(-2px);box-shadow:0 6px 0 #f1c8d9}button:active{transform:translateY(2px);box-shadow:0 1px 0 #f1c8d9}.utility{background:#f8c9dc;color:#a94f79;box-shadow:0 4px 0 #eeb4cb}.operator{background:#f5b8d1;color:#a84c77;box-shadow:0 4px 0 #eaa5c2}.operator.active{background:#e88bb3;color:#fff}.equals{background:linear-gradient(145deg,#ed91b7,#df78a5);color:#fff;box-shadow:0 4px 0 #c96693}.equals:hover{background:linear-gradient(145deg,#e981ad,#d9689a)}.zero{grid-column:span 2}.footer{text-align:center;font-size:11px;color:#d49ab3;font-weight:700;letter-spacing:.5px;margin:19px 0 1px}.footer span{color:#e58db2}
@media(max-width:390px){.calculator{padding:18px}.keys{gap:8px}button{min-height:57px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

    <section class="screen" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression">ingresa un número ♡</div>
      <div class="result" id="result">0</div>
    </section>
    <section class="keys" aria-label="Teclas de la calculadora">
      <button class="utility" data-action="clear">AC</button><button class="utility" data-action="sign">+/−</button><button class="utility" data-action="percent">%</button><button class="operator" data-op="÷">÷</button>
      <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="operator" data-op="×">×</button>
      <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="operator" data-op="−">−</button>
      <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="operator" data-op="+">+</button>
      <button class="zero" data-num="0">0</button><button data-num=".">.</button><button class="equals" data-action="equals">=</button>

</main>
<script>
(() => {
  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const keys = document.querySelector('.keys');
  let current = '0', stored = null, operator = null, waiting = false;

  const pretty = value => value.replace(/\./g, ',');
  function render() {
    resultEl.textContent = pretty(current);
    expressionEl.textContent = stored !== null && operator ? `${pretty(stored)} ${operator}` : 'ingresa un número ♡';
    document.querySelectorAll('[data-op]').forEach(btn => btn.classList.toggle('active', btn.dataset.op === operator));
  }
  function inputDigit(digit) {
    if (current === 'Error') reset();
    if (waiting) { current = digit === '.' ? '0.' : digit; waiting = false; }
    else if (digit === '.') { if (!current.includes('.')) current += '.'; }
    else current = current === '0' ? digit : current.length < 14 ? current + digit : current;
    render();
  }
  function reset() { current = '0'; stored = null; operator = null; waiting = false; render(); }
  function calculate() {
    if (operator === null || stored === null) return;
    const a = Number(stored), b = Number(current); let answer;
    switch (operator) {
      case '+': answer = a + b; break;
      case '−': answer = a - b; break;
      case '×': answer = a * b; break;
      case '÷': answer = b === 0 ? NaN : a / b; break;
    }
    current = Number.isFinite(answer) ? String(Number(answer.toPrecision(11))) : 'Error';
    stored = null; operator = null; waiting = true; render();
    if (current === 'Error') expressionEl.textContent = 'no se puede dividir por cero ♡';
  }
  function chooseOperator(next) {
    if (current === 'Error') return;
    if (operator && !waiting) calculate();
    stored = current; operator = next; waiting = true; render();
  }
  function action(name) {
    if (name === 'clear') reset();
    if (name === 'equals') calculate();
    if (name === 'sign' && current !== '0' && current !== 'Error') { current = String(-Number(current)); render(); }
    if (name === 'percent' && current !== 'Error') { current = String(Number(current) / 100); render(); }
  }
  keys.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button) return;
    if (button.dataset.num !== undefined) inputDigit(button.dataset.num);
    if (button.dataset.op) chooseOperator(button.dataset.op);
    if (button.dataset.action) action(button.dataset.action);
  });
  document.addEventListener('keydown', event => {
    const key = event.key;
    if (/^[0-9.]$/.test(key)) inputDigit(key);
    else if (key === '+') chooseOperator('+');
    else if (key === '-') chooseOperator('−');
    else if (key === '*') chooseOperator('×');
    else if (key === '/') { event.preventDefault(); chooseOperator('÷'); }
    else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
    else if (key === 'Escape') reset();
    else if (key === 'Backspace') { current = current.length > 1 ? current.slice(0, -1) : '0'; render(); }
  });
  render();
})();
</script>
